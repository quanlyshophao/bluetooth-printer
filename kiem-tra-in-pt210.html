
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thử in GOOJPRT PT-210</title>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 25px auto;
  padding: 15px;
  line-height: 1.5;
}
button {
  width: 100%;
  padding: 16px;
  margin: 10px 0;
  font-size: 17px;
}
pre {
  white-space: pre-wrap;
  background: #eee;
  padding: 12px;
}
</style>
</head>

<body>

<h2>KIỂM TRA IN PT-210</h2>

<p>Thử gửi dữ liệu trực tiếp từ Chrome đến máy in MTP-2.</p>

<button id="connect">
1. KẾT NỐI MTP-2
</button>

<button id="print" disabled>
2. IN THỬ MỘT DÒNG
</button>

<button id="disconnect" disabled>
NGẮT KẾT NỐI
</button>

  <button id="taoAnh">
3. TẠO ẢNH TEM TIẾNG VIỆT
</button>

  <button id="kiemTraBitmap">
4. KIỂM TRA BITMAP ĐEN TRẮNG
</button>

  <button id="inThuBitmap">
5. IN THỬ ẢNH BITMAP
</button>

<div id="preview"
style="display:none; margin:15px 0; border:1px solid #999; padding:10px;">
  <p>HÌNH ẢNH TEM XEM TRƯỚC:</p>
  <canvas id="temCanvas"
  style="width:100%; height:auto;"></canvas>
</div>

<pre id="status">Sẵn sàng.</pre>

<script>

const SERVICE_UUID =
"000018f0-0000-1000-8000-00805f9b34fb";

const CHARACTERISTIC_UUID =
"00002af1-0000-1000-8000-00805f9b34fb";

let printer = null;
let printCharacteristic = null;

const statusBox =
document.getElementById("status");

  document.getElementById("taoAnh")
.addEventListener("click", function() {

  const canvas =
  document.getElementById("temCanvas");

  const ctx =
  canvas.getContext("2d");

  const noiDung = [
    "KIỂM TRA TIẾNG VIỆT",
    "Cửa hàng Hảo",
    "Quần áo - Điện thoại",
    "Giá bán: 125.000 đ",
    "",
    "Tiếng Việt có dấu:",
    "ă â ê ô ơ ư đ",
    "Ă Â Ê Ô Ơ Ư Đ",
    "á à ả ã ạ",
    "ắ ằ ẳ ẵ ặ",
    "ấ ầ ẩ ẫ ậ",
    "ế ề ể ễ ệ",
    "ố ồ ổ ỗ ộ",
    "ớ ờ ở ỡ ợ",
    "ứ ừ ử ữ ự"
  ];

  const chieuCaoDong = 34;
  const le = 12;

  canvas.width = 384;

  canvas.height =
    le * 2 + noiDung.length * chieuCaoDong;

  ctx.fillStyle = "#FFFFFF";

  ctx.fillRect(
    0, 0, canvas.width, canvas.height
  );

  ctx.fillStyle = "#000000";

  ctx.font = "22px Arial";

  ctx.textBaseline = "top";

  noiDung.forEach(function(dong, index) {

    ctx.fillText(
      dong,
      le,
      le + index * chieuCaoDong
    );

  });

  document.getElementById("preview")
  .style.display = "block";

  log("Đã tạo ảnh tem tiếng Việt.");

});

document.getElementById("kiemTraBitmap")
.addEventListener("click", function() {

  const canvas =
    document.getElementById("temCanvas");

  if (
    !canvas.width ||
    document.getElementById("preview")
      .style.display === "none"
  ) {

    log("Bạn cần tạo ảnh tem trước.");

    return;

  }

  const ketQua =
    taoBitmapDenTrang(canvas);

  let soPixelDen = 0;

  for (
    let i = 0;
    i < ketQua.data.length;
    i++
  ) {

    let byte = ketQua.data[i];

    for (let bit = 0; bit < 8; bit++) {

      if (byte & (1 << bit)) {
        soPixelDen++;
      }

    }

  }

  log("ĐÃ CHUYỂN BITMAP THÀNH CÔNG.");

  log("Chiều rộng: " + ketQua.width + " pixel");

  log("Chiều cao: " + ketQua.height + " pixel");

  log("Số byte mỗi dòng: " + ketQua.bytesPerRow);

  log("Tổng số byte: " + ketQua.data.length);

  log("Số pixel đen: " + soPixelDen);

});
  
  function taoBitmapDenTrang(canvas) {

  const ctx = canvas.getContext("2d");

  const anh = ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const duLieuAnh = anh.data;

  const chieuRong = canvas.width;
  const chieuCao = canvas.height;

  const soByteMoiDong = Math.ceil(
    chieuRong / 8
  );

  const bitmap = new Uint8Array(
    soByteMoiDong * chieuCao
  );

  for (
    let y = 0;
    y < chieuCao;
    y++
  ) {

    for (
      let x = 0;
      x < chieuRong;
      x++
    ) {

      const viTriAnh =
        (y * chieuRong + x) * 4;

      const doSang =
        (
          duLieuAnh[viTriAnh] +
          duLieuAnh[viTriAnh + 1] +
          duLieuAnh[viTriAnh + 2]
        ) / 3;

      if (doSang < 160) {

        const viTriByte =
          y * soByteMoiDong +
          Math.floor(x / 8);

        const bit =
          7 - (x % 8);

        bitmap[viTriByte] |=
          (1 << bit);

      }

    }

  }

  return {
    width: chieuRong,
    height: chieuCao,
    bytesPerRow: soByteMoiDong,
    data: bitmap
  };

}
  function taoLenhInBitmap(bitmap, chieuCaoDai = 24) {

  const cacGoi = [];

  const chieuRongByte = bitmap.bytesPerRow;

  for (
    let y = 0;
    y < bitmap.height;
    y += chieuCaoDai
  ) {

    const caoDai = Math.min(
      chieuCaoDai,
      bitmap.height - y
    );

    const batDau = y * chieuRongByte;

    const ketThuc =
      (y + caoDai) * chieuRongByte;

    const duLieu = bitmap.data.slice(
      batDau,
      ketThuc
    );

    const lenh = new Uint8Array(
      8 + duLieu.length
    );

    lenh.set([
      0x1D,
      0x76,
      0x30,
      0x00,
      chieuRongByte & 0xFF,
      (chieuRongByte >> 8) & 0xFF,
      caoDai & 0xFF,
      (caoDai >> 8) & 0xFF
    ], 0);

    lenh.set(duLieu, 8);

    cacGoi.push(lenh);

  }

  return cacGoi;

}
const printButton =
document.getElementById("print");

const disconnectButton =
document.getElementById("disconnect");

function log(message) {
  statusBox.textContent += "\n" + message;
}

document.getElementById("connect")
.addEventListener("click", async function() {

  try {

    statusBox.textContent =
    "Đang tìm máy in...";

    printer =
    await navigator.bluetooth.requestDevice({
      filters: [
        { services: [SERVICE_UUID] }
      ],
      optionalServices: [SERVICE_UUID]
    });

    log("Đã chọn: " + printer.name);

    printer.addEventListener(
      "gattserverdisconnected",
      function() {
        printCharacteristic = null;
        printButton.disabled = true;
        disconnectButton.disabled = true;
        log("Máy in đã ngắt kết nối.");
      }
    );

    const server =
    await printer.gatt.connect();

    log("Đã kết nối GATT.");

    const service =
    await server.getPrimaryService(
      SERVICE_UUID
    );

    printCharacteristic =
    await service.getCharacteristic(
      CHARACTERISTIC_UUID
    );

    log("Đã tìm thấy kênh in.");

    printButton.disabled = false;
    disconnectButton.disabled = false;

    log("Sẵn sàng in thử.");

  } catch(error) {

    log(
      "LỖI KẾT NỐI: " +
      error.name + " - " + error.message
    );

  }

});

document.getElementById("print")
.addEventListener("click", async function() {

  if (
    !printer ||
    !printer.gatt.connected ||
    !printCharacteristic
  ) {
    log("Chưa kết nối máy in.");
    return;
  }

  printButton.disabled = true;

  try {

        const noiDung =
      "\x1B\x40" +
      "\nKIEM TRA TIENG VIET\n" +
      "Cua hang Hao\n" +
      "Quan ao - Dien thoai\n" +
      "Gia ban: 125.000 d\n\n" +
      "Tieng Viet co dau:\n" +
      "ă â ê ô ơ ư đ\n" +
      "Ă Â Ê Ô Ơ Ư Đ\n" +
      "á à ả ã ạ\n" +
      "ắ ằ ẳ ẵ ặ\n" +
      "ấ ầ ẩ ẫ ậ\n" +
      "ế ề ể ễ ệ\n" +
      "ố ồ ổ ỗ ộ\n" +
      "ớ ờ ở ỡ ợ\n" +
      "ứ ừ ử ữ ự\n\n\n";

    const bytes =
    new TextEncoder().encode(noiDung);

    const kichThuocGoi = 100;

    for (
      let i = 0;
      i < bytes.length;
      i += kichThuocGoi
    ) {

      const goi =
      bytes.slice(i, i + kichThuocGoi);

      if (
        printCharacteristic.writeValueWithoutResponse
      ) {

        await printCharacteristic
        .writeValueWithoutResponse(goi);

      } else {

        await printCharacteristic
        .writeValue(goi);

      }

      await new Promise(function(resolve) {
        setTimeout(resolve, 50);
      });

    }

    log("Đã gửi lệnh in. Hãy kiểm tra giấy.");

  } catch(error) {

    log(
      "LỖI IN: " +
      error.name + " - " + error.message
    );

  } finally {

    printButton.disabled = false;

  }

});

document.getElementById("disconnect")
.addEventListener("click", function() {

  if (
    printer &&
    printer.gatt &&
    printer.gatt.connected
  ) {
    printer.gatt.disconnect();
  }

});

  document.getElementById("inThuBitmap")
.addEventListener("click", async function() {

  if (
    !printer ||
    !printer.gatt.connected ||
    !printCharacteristic
  ) {
    log("Chưa kết nối máy in.");
    return;
  }

  const canvas =
    document.getElementById("temCanvas");

  if (!canvas.width) {
    log("Bạn cần tạo ảnh tem trước.");
    return;
  }

  const nut =
    document.getElementById("inThuBitmap");

  nut.disabled = true;

  try {

    const bitmap =
      taoBitmapDenTrang(canvas);

    const cacGoi =
      taoLenhInBitmap(bitmap, 24);

    log("Bắt đầu gửi ảnh bitmap...");

    // Khởi tạo máy in
    const khoiTao = new Uint8Array([
      0x1B, 0x40
    ]);

    await printCharacteristic
      .writeValue(khoiTao);

    await new Promise(function(resolve) {
      setTimeout(resolve, 100);
    });

    for (
      let g = 0;
      g < cacGoi.length;
      g++
    ) {

      const goi = cacGoi[g];

      for (
        let i = 0;
        i < goi.length;
        i += 100
      ) {

        const phan = goi.slice(
          i,
          i + 100
        );

        if (
          printCharacteristic.writeValueWithoutResponse
        ) {

          await printCharacteristic
            .writeValueWithoutResponse(phan);

        } else {

          await printCharacteristic
            .writeValue(phan);

        }

        await new Promise(function(resolve) {
          setTimeout(resolve, 50);
        });

      }

      log(
        "Đã gửi dải " +
        (g + 1) + "/" + cacGoi.length
      );

      await new Promise(function(resolve) {
        setTimeout(resolve, 100);
      });

    }

    log("Đã gửi toàn bộ ảnh bitmap.");

  } catch(error) {

    log(
      "LỖI IN BITMAP: " +
      error.name + " - " + error.message
    );

  } finally {

    nut.disabled = false;

  }

});

  // KIỂM TRA CẦU NỐI VỚI WEB APP SHOP HẢO
if (window.opener && !window.opener.closed) {

  const webAppOrigin = new URL(document.referrer).origin;

  window.opener.postMessage(
    {
      type: "SHOPHAO_PRINTER_READY"
    },
  "*"
  );

  log("Đã gửi tín hiệu đến Web App Shop Hảo.");

} else {

  log("Không tìm thấy cửa sổ hoặc địa chỉ Web App.");

}
  
  // NHẬN LỆNH TỪ WEB APP SHOP HẢO
window.addEventListener("message", function(event) {

  if (
    !event.origin.endsWith(".googleusercontent.com") &&
    event.origin !== "https://script.google.com"
  ) {
    return;
  }

  if (
    event.data &&
    event.data.type === "SHOPHAO_TEST_FROM_WEBAPP"
  ) {

    log("Đã nhận tín hiệu thử từ Web App Shop Hảo.");

    event.source.postMessage(
      {
        type: "SHOPHAO_TEST_ACK"
      },
      event.origin
    );

  }

});

</script>

</body>
</html>
