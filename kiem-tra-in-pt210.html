const SERVICE_UUID =

const CHARACTERISTIC_UUID =

let printer = null;

  document.getElementById("taoAnh")

  const noiDung = [

    "Giá bán: 125.000 đ",

document.getElementById("kiemTraBitmap")
.addEventListener("click", function() {

  const canvas =
    document.getElementById("temCanvas");

  if (
    !canvas.width ||
    document.getElementById("preview")
      .style.display === "none"
  ) {

    log("Bạn cần tạo ảnh tem trước.");

    return;

  }

  const ketQua =
    taoBitmapDenTrang(canvas);

  let soPixelDen = 0;

  for (
    let i = 0;
    i < ketQua.data.length;
    i++
  ) {

    let byte = ketQua.data[i];

    for (let bit = 0; bit < 8; bit++) {

      if (byte & (1 << bit)) {
        soPixelDen++;
      }

    }

  }

  log("ĐÃ CHUYỂN BITMAP THÀNH CÔNG.");

  log("Chiều rộng: " + ketQua.width + " pixel");

  log("Chiều cao: " + ketQua.height + " pixel");

  log("Số byte mỗi dòng: " + ketQua.bytesPerRow);

  log("Tổng số byte: " + ketQua.data.length);

  log("Số pixel đen: " + soPixelDen);

});

  // ==========================================================
// TẠO ẢNH TEM RI 384 × 120 PIXEL
// ==========================================================

function dinhDangTienBluetooth(value) {
  const so = Number(value || 0);

  return so.toLocaleString("vi-VN") + " đ";
}

function taoCanvasTemBluetooth(item) {
  const canvas = document.createElement("canvas");

  canvas.width = 384;
  canvas.height = 120;

  const ctx = canvas.getContext("2d");

  // Nền trắng.
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Chữ màu đen, căn giữa.
  ctx.fillStyle = "#000000";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";

  // Dòng 1: Mã sản phẩm.
  ctx.font = "bold 28px Arial";
  ctx.fillText(
    String(item.maSP || ""),
    canvas.width / 2,
    8
  );

  // Dòng 2: Size.
  ctx.font = "24px Arial";
  ctx.fillText(
    String(item.size || ""),
    canvas.width / 2,
    44
  );

  // Dòng 3: Giá bán.
  ctx.font = "26px Arial";
  ctx.fillText(
    dinhDangTienBluetooth(item.giaBan),
    canvas.width / 2,
    78
  );

  return canvas;
}
  
  function taoBitmapDenTrang(canvas) {

  const ctx = canvas.getContext("2d");

  const anh = ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const duLieuAnh = anh.data;

  const chieuRong = canvas.width;
  const chieuCao = canvas.height;

  const soByteMoiDong = Math.ceil(
    chieuRong / 8
  );

  const bitmap = new Uint8Array(
    soByteMoiDong * chieuCao
  );

  for (
    let y = 0;
    y < chieuCao;
    y++
  ) {

    for (
      let x = 0;
      x < chieuRong;
      x++
    ) {

      const viTriAnh =
        (y * chieuRong + x) * 4;

      const doSang =
        (
          duLieuAnh[viTriAnh] +
          duLieuAnh[viTriAnh + 1] +
          duLieuAnh[viTriAnh + 2]
        ) / 3;

      if (doSang < 160) {

        const viTriByte =
          y * soByteMoiDong +
          Math.floor(x / 8);

        const bit =
          7 - (x % 8);

        bitmap[viTriByte] |=
          (1 << bit);

      }

    }

  }

  return {
    width: chieuRong,
    height: chieuCao,
    bytesPerRow: soByteMoiDong,
    data: bitmap
  };

}
  function taoLenhInBitmap(bitmap, chieuCaoDai = 24) {

  const cacGoi = [];

  const chieuRongByte = bitmap.bytesPerRow;

  for (
    let y = 0;
    y < bitmap.height;
    y += chieuCaoDai
  ) {

    const caoDai = Math.min(
      chieuCaoDai,
      bitmap.height - y
    );

    const batDau = y * chieuRongByte;

    const ketThuc =
      (y + caoDai) * chieuRongByte;

    const duLieu = bitmap.data.slice(
      batDau,
      ketThuc
    );

    const lenh = new Uint8Array(
      8 + duLieu.length
    );

    lenh.set([
      0x1D,
      0x76,
      0x30,
      0x00,
      chieuRongByte & 0xFF,
      (chieuRongByte >> 8) & 0xFF,
      caoDai & 0xFF,
      (caoDai >> 8) & 0xFF
    ], 0);

    lenh.set(duLieu, 8);

    cacGoi.push(lenh);

  }

  return cacGoi;

}

  // ==========================================================
// GIAO TIẾP GIỮA GITHUB VÀ APPS SCRIPT
// ==========================================================

const APPS_SCRIPT_BLUETOOTH_URL =
"https://script.google.com/macros/s/AKfycbwKe_aIRFig93ULwmGsYYaehBZSlhVSN-UGVKfRv3K2Wnh1ydAp7fQx1kS_DxDNX5L-Vg/exec";

let demCallbackBluetooth = 0;

function goiAppsScriptBluetooth(thamSo) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "nhanPhanHoiBluetooth_" +
      Date.now() + "_" +
      (++demCallbackBluetooth);

    const script = document.createElement("script");

    let daHoanTat = false;

    const timeout = setTimeout(function() {
      ketThucLoi(
        new Error("Apps Script không phản hồi sau 15 giây.")
      );
    }, 15000);

    function donDep() {
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    }

    function ketThucLoi(error) {
      if (daHoanTat) return;
      daHoanTat = true;
      donDep();
      reject(error);
    }

    window[callbackName] = function(ketQua) {
      if (daHoanTat) return;
      daHoanTat = true;
      donDep();
      resolve(ketQua);
    };

    const params = new URLSearchParams();

    Object.keys(thamSo).forEach(function(key) {
      params.set(key, thamSo[key]);
    });

    params.set("callback", callbackName);

    script.async = true;

    script.src =
      APPS_SCRIPT_BLUETOOTH_URL +
      "?" + params.toString();

    script.onerror = function() {
      ketThucLoi(
        new Error("Không kết nối được với Apps Script.")
      );
    };

    document.head.appendChild(script);

  });
}

// ==========================================================
// NHẬN MỘT LỆNH IN TỪ HÀNG ĐỢI APPS SCRIPT
// ==========================================================

async function nhanLenhInBluetooth(maThietBi) {

  const ketQua = await goiAppsScriptBluetooth({
    bridgeAction: "nhanLenh",
    maThietBi: maThietBi
  });

  if (!ketQua || ketQua.ok !== true) {
    throw new Error(
      ketQua && ketQua.message
        ? ketQua.message
        : "Không nhận được phản hồi hợp lệ từ Apps Script."
    );
  }

  return ketQua;
}

  // ==========================================================
// XỬ LÝ VÀ IN TOÀN BỘ TEM CỦA MỘT LỆNH RI
// ==========================================================

async function xuLyLenhInBluetooth(ketQuaNhan, maThietBi) {

  if (
    !ketQuaNhan ||
    ketQuaNhan.ok !== true ||
    ketQuaNhan.coLenh !== true
  ) {
    throw new Error("Không có lệnh in hợp lệ.");
  }

  const maLenh = ketQuaNhan.maLenh;
  const duLieuIn = ketQuaNhan.duLieuIn;

  let thanhCong = false;
  let noiDungKetQua = "";

  try {

    if (
      !duLieuIn ||
      !Array.isArray(duLieuIn.sanPhamTrongRi) ||
      duLieuIn.sanPhamTrongRi.length === 0
    ) {
      throw new Error("Lệnh in không có danh sách sản phẩm.");
    }

    if (
      !printer ||
      !printer.gatt.connected ||
      !printCharacteristic
    ) {
      throw new Error("Máy in chưa kết nối.");
    }

    let tongTemDaIn = 0;

    for (
      let i = 0;
      i < duLieuIn.sanPhamTrongRi.length;
      i++
    ) {

      const item = duLieuIn.sanPhamTrongRi[i];

      const soLuong = Number(item.soLuong || 0);

      if (
        !Number.isInteger(soLuong) ||
        soLuong < 1
      ) {
        throw new Error(
          "Số lượng tem không hợp lệ tại sản phẩm " +
          (i + 1)
        );
      }

      for (let j = 0; j < soLuong; j++) {

        const canvas = taoCanvasTemBluetooth(item);

        await inCanvasTemBluetooth(canvas);

        tongTemDaIn++;

        log(
          "Đã in tem " + tongTemDaIn +
          " - " + String(item.maSP || "")
        );
      }
    }

    thanhCong = true;

    noiDungKetQua =
      "Đã in thành công " + tongTemDaIn + " tem.";

  } catch (error) {

    noiDungKetQua = String(
      error.message || error
    );

    log("LỖI XỬ LÝ LỆNH IN: " + noiDungKetQua);

  }

  const phanHoi = await goiAppsScriptBluetooth({
    bridgeAction: "traKetQua",
    maLenh: maLenh,
    maThietBi: maThietBi,
    thanhCong: thanhCong ? "1" : "0",
    ketQua: noiDungKetQua
  });

  if (!phanHoi || phanHoi.ok !== true) {
    throw new Error(
      "Không xác nhận được kết quả với Apps Script. " +
      "Phản hồi: " + JSON.stringify(phanHoi)
    );
  }

  log(
    thanhCong
      ? "Apps Script đã xác nhận in thành công."
      : "Apps Script đã ghi nhận lệnh in thất bại."
  );

  return thanhCong;
}
  
  // ==========================================================
// IN MỘT ẢNH TEM RI QUA BLUETOOTH
// ==========================================================

async function inCanvasTemBluetooth(canvas) {

  if (
    !printer ||
    !printer.gatt.connected ||
    !printCharacteristic
  ) {
    throw new Error("Máy in chưa kết nối.");
  }

  if (!canvas || !canvas.width || !canvas.height) {
    throw new Error("Ảnh tem không hợp lệ.");
  }

  const bitmap = taoBitmapDenTrang(canvas);

  const cacGoi = taoLenhInBitmap(bitmap, 24);

  // Khởi tạo máy in.
  const khoiTao = new Uint8Array([
    0x1B, 0x40
  ]);

  await printCharacteristic.writeValue(khoiTao);

  await new Promise(function(resolve) {
    setTimeout(resolve, 100);
  });

  // Gửi từng dải bitmap.
  for (let g = 0; g < cacGoi.length; g++) {

    const goi = cacGoi[g];

    for (let i = 0; i < goi.length; i += 100) {

      const phan = goi.slice(i, i + 100);

      if (printCharacteristic.writeValueWithoutResponse) {
        await printCharacteristic.writeValueWithoutResponse(phan);
      } else {
        await printCharacteristic.writeValue(phan);
      }

      await new Promise(function(resolve) {
        setTimeout(resolve, 50);
      });
    }

    await new Promise(function(resolve) {
      setTimeout(resolve, 100);
    });
  }

  return true;
}
  
const printButton =
document.getElementById("print");

const disconnectButton =
document.getElementById("disconnect");

function log(message) {
  statusBox.textContent += "\n" + message;
}

document.getElementById("connect")
.addEventListener("click", async function() {

  try {

    statusBox.textContent =
    "Đang tìm máy in...";

    printer =
    await navigator.bluetooth.requestDevice({
      filters: [
        { services: [SERVICE_UUID] }
      ],
      optionalServices: [SERVICE_UUID]
    });

    log("Đã chọn: " + printer.name);

    printer.addEventListener(
      "gattserverdisconnected",
      function() {
        printCharacteristic = null;
        printButton.disabled = true;
        disconnectButton.disabled = true;
        log("Máy in đã ngắt kết nối.");
      }
    );

    const server =
    await printer.gatt.connect();

    log("Đã kết nối GATT.");

    const service =
    await server.getPrimaryService(
      SERVICE_UUID
    );

    printCharacteristic =
    await service.getCharacteristic(
      CHARACTERISTIC_UUID
    );

    log("Đã tìm thấy kênh in.");

    printButton.disabled = false;
    disconnectButton.disabled = false;

    log("Sẵn sàng in thử.");

  } catch(error) {

    log(
      "LỖI KẾT NỐI: " +
      error.name + " - " + error.message
    );

  }

});

document.getElementById("print")
.addEventListener("click", async function() {

  if (
    !printer ||
    !printer.gatt.connected ||
    !printCharacteristic
  ) {
    log("Chưa kết nối máy in.");
    return;
  }

  printButton.disabled = true;

  try {

        const noiDung =
      "\x1B\x40" +
      "\nKIEM TRA TIENG VIET\n" +
      "Cua hang Hao\n" +
      "Quan ao - Dien thoai\n" +
      "Gia ban: 125.000 d\n\n" +
      "Tieng Viet co dau:\n" +
      "ă â ê ô ơ ư đ\n" +
      "Ă Â Ê Ô Ơ Ư Đ\n" +
      "á à ả ã ạ\n" +
      "ắ ằ ẳ ẵ ặ\n" +
      "ấ ầ ẩ ẫ ậ\n" +
      "ế ề ể ễ ệ\n" +
      "ố ồ ổ ỗ ộ\n" +
      "ớ ờ ở ỡ ợ\n" +
      "ứ ừ ử ữ ự\n\n\n";

    const bytes =
    new TextEncoder().encode(noiDung);

    const kichThuocGoi = 100;

    for (
      let i = 0;
      i < bytes.length;
      i += kichThuocGoi
    ) {

      const goi =
      bytes.slice(i, i + kichThuocGoi);

      if (
        printCharacteristic.writeValueWithoutResponse
      ) {

        await printCharacteristic
        .writeValueWithoutResponse(goi);

      } else {

        await printCharacteristic
        .writeValue(goi);

      }

      await new Promise(function(resolve) {
        setTimeout(resolve, 50);
      });

    }

    log("Đã gửi lệnh in. Hãy kiểm tra giấy.");

  } catch(error) {

    log(
      "LỖI IN: " +
      error.name + " - " + error.message
    );

  } finally {

    printButton.disabled = false;

  }

});

document.getElementById("disconnect")
.addEventListener("click", function() {

  if (
    printer &&
    printer.gatt &&
    printer.gatt.connected
  ) {
    printer.gatt.disconnect();
  }

});

  document.getElementById("inThuBitmap")
.addEventListener("click", async function() {

  if (
    !printer ||
    !printer.gatt.connected ||
    !printCharacteristic
  ) {
    log("Chưa kết nối máy in.");
    return;
  }

  const canvas =
    document.getElementById("temCanvas");

  if (!canvas.width) {
    log("Bạn cần tạo ảnh tem trước.");
    return;
  }

  const nut =
    document.getElementById("inThuBitmap");

  nut.disabled = true;

  try {

    const bitmap =
      taoBitmapDenTrang(canvas);

    const cacGoi =
      taoLenhInBitmap(bitmap, 24);

    log("Bắt đầu gửi ảnh bitmap...");

    // Khởi tạo máy in
    const khoiTao = new Uint8Array([
      0x1B, 0x40
    ]);

    await printCharacteristic
      .writeValue(khoiTao);

    await new Promise(function(resolve) {
      setTimeout(resolve, 100);
    });

    for (
      let g = 0;
      g < cacGoi.length;
      g++
    ) {

      const goi = cacGoi[g];

      for (
        let i = 0;
        i < goi.length;
        i += 100
      ) {

        const phan = goi.slice(
          i,
          i + 100
        );

        if (
          printCharacteristic.writeValueWithoutResponse
        ) {

          await printCharacteristic
            .writeValueWithoutResponse(phan);

        } else {

          await printCharacteristic
            .writeValue(phan);

        }

        await new Promise(function(resolve) {
          setTimeout(resolve, 50);
        });

      }

      log(
        "Đã gửi dải " +
        (g + 1) + "/" + cacGoi.length
      );

      await new Promise(function(resolve) {
        setTimeout(resolve, 100);
      });

    }

    log("Đã gửi toàn bộ ảnh bitmap.");

  } catch(error) {

    log(
      "LỖI IN BITMAP: " +
      error.name + " - " + error.message
    );

  } finally {

    nut.disabled = false;

  }

});

  // NHẬN LỆNH TỪ WEB APP SHOP HẢO
window.addEventListener("message", function(event) {

  if (
    !event.origin.endsWith(".googleusercontent.com") &&
    event.origin !== "https://script.google.com"
  ) {
    return;
  }

  if (
    event.data &&
    event.data.type === "SHOPHAO_TEST_FROM_WEBAPP"
  ) {

    log("Đã nhận tín hiệu thử từ Web App Shop Hảo.");

    event.source.postMessage(
      {
        type: "SHOPHAO_TEST_ACK"
      },
      event.origin
    );

  }

});

</script>
